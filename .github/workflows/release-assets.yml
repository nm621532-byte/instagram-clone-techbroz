# Attaches the v1.x downloads to the GitHub Release:
#  - instaglass-web-v1.0.zip : the web app (server + client + seed + tests), zipped from this tag
#  - InstaGlass-v1.0.apk     : the signed Android app, built on the maintainer's machine and hosted on the
#                              live site; its SHA-256 is checked here so nothing can be swapped.
name: release-assets
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web-app zip from the repo
        run: git archive --format=zip --prefix=instaglass/ -o instaglass-web-v1.0.zip HEAD
      - name: Download the signed APK and verify it
        run: |
          curl -fL --retry 3 -o InstaGlass-v1.0.apk https://instaglass-live.sites.tab.bot/InstaGlass-v1.0.apk
          echo "7dd70973e7bf9ec1d6ba990135f3cbd00408e68b2cbeffb952507781c2f2d48f  InstaGlass-v1.0.apk" | sha256sum -c
          sha256sum InstaGlass-v1.0.apk instaglass-web-v1.0.zip > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.0 InstaGlass-v1.0.apk instaglass-web-v1.0.zip SHA256SUMS --clobber --repo ${{ github.repository }}
