# Attaches the downloads to every GitHub Release (v1.0, v1.1, ...):
#  - instaglass-web-<tag>.zip : the web app (server + client + tests), zipped from the tagged commit
#  - InstaGlass-<tag>.apk     : the signed Android app ("Private Insta"), built on the maintainer's machine and hosted
#                              on the live site; its SHA-256 (release/InstaGlass-<tag>.apk.sha256) is checked so nothing can be swapped.
name: release-assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1'
        required: true
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build web-app zip from the repo
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          git archive --format=zip --prefix=instaglass/ -o "instaglass-web-$TAG.zip" HEAD
      - name: Download the signed APK and verify it
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          curl -fL --retry 3 -o "InstaGlass-$TAG.apk" "https://instaglass-live.sites.tab.bot/InstaGlass-$TAG.apk"
          if [ -f "release/InstaGlass-$TAG.apk.sha256" ]; then sha256sum -c "release/InstaGlass-$TAG.apk.sha256"; fi
          sha256sum "InstaGlass-$TAG.apk" "instaglass-web-$TAG.zip" > SHA256SUMS
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" "InstaGlass-$TAG.apk" "instaglass-web-$TAG.zip" SHA256SUMS --clobber --repo ${{ github.repository }}
